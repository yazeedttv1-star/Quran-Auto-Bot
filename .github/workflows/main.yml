name: Quran Video Bot

on:
  schedule:
    # تشغيل المهمة كل 5 دقائق (أقل حد مسموح به في GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install FFmpeg, System Fonts and Raqm Engine
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-dejavu fonts-noto-core libraqm-dev libharfbuzz-dev libfribidi-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-binary :all: pillow
        pip install "moviepy>=2.0.0" requests numpy urllib3

    - name: Run Script
      env:
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py
